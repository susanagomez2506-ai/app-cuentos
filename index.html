<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuentos para ordenar</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2b2350;--c:#7b5cff;--cl:#ece6ff;--pink:#ff5fa2;--sun:#ffd23f;--mint:#2ec4a6;--sky:#35a7ff;--org:#ff9f1c}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:Andika,"Comic Sans MS","Trebuchet MS",sans-serif;font-size:1.25rem;line-height:1.8;letter-spacing:.02em;min-height:100vh;background:radial-gradient(circle at 8% 18%,#ffd23f66 0 44px,transparent 45px),radial-gradient(circle at 92% 8%,#ff5fa266 0 64px,transparent 65px),radial-gradient(circle at 88% 92%,#35a7ff66 0 76px,transparent 77px),radial-gradient(circle at 4% 86%,#2ec4a666 0 54px,transparent 55px),linear-gradient(#d9f0ff,#f1e6ff 55%,#ffe6f1) fixed}
main{max-width:660px;margin:0 auto;padding:18px 16px 60px}
h1,button,.t,.sub{font-family:Fredoka,"Trebuchet MS",sans-serif}
h1{font-size:2.2rem;line-height:1.2;margin:8px 0 6px;text-align:center;color:var(--ink);text-shadow:3px 3px 0 var(--sun)}
p.sub{text-align:center;margin:0 0 20px;font-size:1.3rem;font-weight:500}
button{font:inherit;font-weight:700;color:#fff;border:0;cursor:pointer;border-radius:22px;padding:10px 24px;min-height:58px;background:var(--c);box-shadow:0 5px 0 rgba(0,0,0,.22);text-shadow:0 1px 0 rgba(0,0,0,.18)}
button:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
button:focus-visible,.card:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
button.go{background:var(--mint)}
button.ghost{background:#fff;color:var(--ink);text-shadow:none;box-shadow:0 5px 0 #c9bfe8}
button.hint{background:var(--sun);color:var(--ink);text-shadow:none;box-shadow:0 5px 0 #d1a600}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.story{display:flex;align-items:center;gap:16px;width:100%;text-align:left;background:var(--c);margin-bottom:18px;padding:14px 20px;font-size:1.4rem}
.story .big{font-size:3.2rem;line-height:1;background:var(--cl);border-radius:50%;width:78px;height:78px;display:flex;align-items:center;justify-content:center;flex:none}
.scene{font-size:5.6rem;text-align:center;line-height:1.2;background:var(--cl);border:5px dashed var(--c);border-radius:32px;padding:16px;margin:10px 0}
.text{background:#fff;border:5px solid var(--c);border-radius:26px;padding:18px 22px;font-size:1.4rem;line-height:1.9}
.dots{display:flex;justify-content:center;gap:10px;margin:12px 0}
.dots i{width:18px;height:18px;border-radius:50%;background:#fff;border:3px solid var(--c)}
.dots i.on{background:var(--c)}
#list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.card{display:flex;align-items:center;gap:12px;background:var(--b);border-radius:22px;padding:12px 16px;border:5px solid #fff;touch-action:none;user-select:none;cursor:grab;box-shadow:0 5px 0 rgba(43,35,80,.18)}
.card .e{font-size:2.5rem;line-height:1;background:#fff;border-radius:50%;width:62px;height:62px;display:flex;align-items:center;justify-content:center;flex:none}
.card .t{flex:1;font-size:1.2rem;line-height:1.4;font-weight:500}
.grip{font-size:1.8rem;opacity:.45}
.card.ok{border-color:var(--mint)}
.card.glow{border-color:var(--sun);box-shadow:0 0 0 6px #ffd23f88}
.card.drag{position:relative;z-index:5;box-shadow:0 14px 26px rgba(43,35,80,.3);cursor:grabbing;rotate:-1.5deg}
#msg{min-height:3.8em;text-align:center;font-weight:700;margin:14px 0 0;background:#ffffffaa;border-radius:20px;padding:8px 14px}
.party{font-size:4.5rem;text-align:center;margin:10px 0}
.tick{color:#fff;background:var(--mint);border-radius:50%;padding:0 8px;font-size:1.1rem}
@media (prefers-reduced-motion:no-preference){.party span{display:inline-block;animation:b 1s ease-in-out infinite alternate}.party span:nth-child(2){animation-delay:.2s}.party span:nth-child(3){animation-delay:.4s}.card.glow{animation:g 1s ease-in-out infinite alternate}}
@keyframes b{to{transform:translateY(-16px)}}
@keyframes g{to{transform:scale(1.03)}}
</style>
</head>
<body>
<main id="app"></main>
<script>
const S=[
{id:0,t:"Lúa y el robot aspiradora",e:"🤖",p:[
["🛋️","Lúa vio que su robot aspiradora se había quedado atascado debajo del sofá. Pitaba muy bajito, como si pidiera ayuda.","El robot se atasca bajo el sofá"],
["🙋‍♀️","Lúa se tumbó en el suelo y lo sacó con mucho cuidado. Por suerte, el robot no se había roto.","Lúa rescata al robot"],
["🧦","Entonces Lúa guardó los calcetines que estaban tirados. Así el robot ya no tendría más problemas.","Lúa recoge los calcetines"],
["✨","El robot limpió toda la sala sin atascarse. Lúa le dio las gracias y los dos acabaron muy contentos.","El robot limpia la sala"]]},
{id:1,t:"Teo y la tablet sin batería",e:"🔋",p:[
["📱","Teo quería jugar con su tablet, pero se había quedado sin batería. Estaba muy enfadado.","La tablet de Teo no tiene batería"],
["🔌","Su mamá la puso a cargar y le dijo que tardaría un buen rato. Teo suspiró.","Mamá pone la tablet a cargar"],
["⚽","Teo bajó al parque y encontró a su amigo Iván con una pelota. Jugaron hasta quedar cansados.","Teo juega a la pelota con Iván"],
["😄","Al volver a casa, Teo se dio cuenta de que ya no tenía tantas ganas de tablet. Se había divertido mucho.","Teo vuelve feliz a casa"]]},
{id:2,t:"Galletas con la abuela",e:"🍪",p:[
["📞","Llovía mucho y Nora no podía ir a casa de su abuela. Por eso la llamó por videollamada.","Nora llama a su abuela"],
["🥣","La abuela le enseñó a mezclar harina, huevo y azúcar. Cada una lo hacía en su cocina.","Mezclan los ingredientes"],
["🔥","Con ayuda de papá, Nora metió la bandeja al horno. Toda la casa empezó a oler delicioso.","Las galletas van al horno"],
["📸","Nora y la abuela se sacaron una foto con sus galletas. Aunque estaban lejos, fue una tarde muy dulce.","Se hacen una foto con las galletas"]]}
];
const app=document.getElementById("app"),done=new Set(),can="speechSynthesis" in window;
let st,page,order,hint,fixed,hp,glow=-1;
const C=[["#ff5fa2","#ffe0ef"],["#35a7ff","#dff1ff"],["#ff9f1c","#fff0d6"]],P=["#ffe0ef","#dff1ff","#fff0d6","#dff7ea"];
const sh=a=>{a=[...a];do{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}while(a.every((x,i)=>x===i)||a[0]===0);return a};
function say(t){if(!can)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="es-ES";u.rate=.85;speechSynthesis.speak(u)}
function stop(){if(can)speechSynthesis.cancel()}
function home(){stop();app.innerHTML=`<h1>📚 Cuentos para ordenar</h1><p class="sub">Elige un cuento. ¡Léelo y ordénalo!</p>`+S.map(s=>`<button class="story" style="--c:${C[s.id][0]};--cl:${C[s.id][1]}" onclick="start(${s.id})"><span class="big">${s.e}</span><span>${s.t} ${done.has(s.id)?'<span class="tick">✔</span>':''}</span></button>`).join("")}
function start(i){st=S[i];page=0;document.body.style.setProperty("--c",C[i][0]);document.body.style.setProperty("--cl",C[i][1]);read()}
function read(){const p=st.p[page],last=page===st.p.length-1;
app.innerHTML=`<h1>${st.t}</h1><div class="dots">${st.p.map((_,i)=>`<i class="${i===page?'on':''}"></i>`).join("")}</div><div class="scene" aria-hidden="true">${p[0]}</div><div class="text">${p[1]}</div><div class="row">${can?`<button class="ghost" onclick="say(st.p[page][1])">🔊 Escuchar</button>`:""}</div><div class="row"><button class="ghost" onclick="${page?'page--;read()':'home()'}">${page?'⬅️ Atrás':'🏠 Inicio'}</button><button class="go" onclick="${last?'game()':'page++;read()'}">${last?'¡A ordenar! 🧩':'Seguir ➡️'}</button></div>`;scrollTo(0,0);stop()}
function game(){order=sh(st.p.map((_,i)=>i));hint=0;hp=0;glow=-1;fixed=new Set();draw("Ordena los dibujos como pasó en el cuento. Arrastra cada tarjeta con el dedo.")}
function draw(m,ok=[]){stop();app.innerHTML=`<h1>🧩 ¿Qué pasó primero?</h1><div id="list">${order.map((k,i)=>`<div class="card ${ok.includes(i)?'ok':''} ${k===glow?'glow':''}" style="--b:${P[k%4]}" data-i="${i}" tabindex="0"><span class="e">${st.p[k][0]}</span><span class="t">${st.p[k][2]}</span><span class="grip" aria-hidden="true">⠿</span></div>`).join("")}</div><div id="msg" role="status">${m}</div><div class="row"><button class="hint" onclick="pista()">💡 Pista</button><button class="ghost" onclick="page=0;read()">📖 Leer</button><button class="go" onclick="check()">¡Listo! ✔</button></div>`;bind()}
function mv(i,d){const j=i+d;if(j<0||j>=order.length||fixed.has(i)||fixed.has(j))return;[order[i],order[j]]=[order[j],order[i]];draw("");const c=document.querySelectorAll(".card")[j];c&&c.focus()}
function bind(){document.querySelectorAll(".card").forEach(c=>{c.addEventListener("keydown",e=>{if(e.key==="ArrowUp"||e.key==="ArrowDown"){e.preventDefault();mv(+c.dataset.i,e.key==="ArrowUp"?-1:1)}});c.addEventListener("pointerdown",e=>{if(e.target.closest("button")||fixed.has(+c.dataset.i))return;e.preventDefault();c.setPointerCapture(e.pointerId);const cs=[...document.querySelectorAll(".card")],i0=+c.dataset.i,y0=e.clientY;c.classList.add("drag");
const mvf=ev=>{c.style.transform=`translateY(${ev.clientY-y0}px)`};
const up=ev=>{c.removeEventListener("pointermove",mvf);c.removeEventListener("pointerup",up);c.removeEventListener("pointercancel",up);let t=i0;cs.forEach((o,i)=>{if(o===c)return;const r=o.getBoundingClientRect();if(i<i0&&ev.clientY<r.top+r.height/2&&i<t)t=i;if(i>i0&&ev.clientY>r.top+r.height/2&&i>t)t=i});
if(t!==i0&&!fixed.has(t)){const[x]=order.splice(i0,1);order.splice(t,0,x)}draw("")};
c.addEventListener("pointermove",mvf);c.addEventListener("pointerup",up);c.addEventListener("pointercancel",up)})})}
function check(){glow=-1;const good=order.map((k,i)=>k===i);if(good.every(Boolean)){win();return}
hint++;
if(hint===1){draw("¡Buen intento! Fíjate bien: ¿qué pasó primero en el cuento? Puedes probar otra vez. 💪")}
else if(hint===2){draw("¡Vas muy bien! Las tarjetas con borde verde ya están en su sitio. 🌟",good.map((g,i)=>g?i:-1).filter(i=>i>=0))}
else if(hint===3){draw("Si quieres, lee el cuento otra vez con el botón 📖 y vuelve a intentarlo. ¡Tú puedes!",good.map((g,i)=>g?i:-1).filter(i=>i>=0))}
else{const w=good.indexOf(false),k=order.indexOf(w);[order[w],order[k]]=[order[k],order[w]];fixed=new Set(order.map((x,i)=>x===i?i:-1).filter(i=>i>=0));if(order.every((x,i)=>x===i)){win();return}draw("Te he ayudado a poner una tarjeta en su sitio. ¡Ahora sigue tú! 🤝",[...fixed])}}
function pista(){hp++;const good=order.map((k,i)=>k===i),oks=good.map((g,i)=>g?i:-1).filter(i=>i>=0),w=good.indexOf(false);glow=-1;
if(w<0){check();return}
if(hp===1)draw("Las tarjetas con borde verde ya están bien. ¡Fíjate en las demás! 🔍",oks);
else if(hp===2){draw("Pista: en el lugar "+(w+1)+" va esto: «"+st.p[w][1]+"»",oks);say(st.p[w][1])}
else{glow=order.indexOf(w);glow=w;draw("La tarjeta que brilla ✨ va en el lugar "+(w+1)+". ¡Llévala allí!",oks)}}
function win(){stop();done.add(st.id);app.innerHTML=`<h1>¡Lo conseguiste!</h1><div class="party"><span>🎉</span><span>⭐</span><span>🎉</span></div><p class="sub">Ordenaste muy bien el cuento de <b>${st.t}</b>. ¡Qué buen lector!</p><div class="row"><button class="ghost" onclick="start(${st.id})">🔁 Repetir</button><button class="go" onclick="home()">📚 Otro cuento</button></div>`}
home();
</script>
</body>
</html>
